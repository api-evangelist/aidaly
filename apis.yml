aid: aidaly
name: Aidaly
description: >-
  Aidaly is a Miami, Florida home care company, founded in 2021 by CEO Margaret "Maggie" Norris, that trains,
  employs and pays family members as professional caregivers so households can draw on Medicaid, Medicare and
  private benefit dollars for care they were already giving unpaid. It runs a software-enabled care agency on
  its own aidalyOS platform - Aidaly Care, a caregiver mobile app with insurance-required electronic visit
  verification, care plans, visit notes and pay tracking; AidalyHQ, a credentialed console for supervising
  nurses; a Learning Studio training library; and a care-team nurse network. It operates in South Florida,
  Arizona and Michigan with Colorado and Massachusetts announced, is contracted into payer networks including
  Molina Healthcare and Meridian, displays Vanta-attested SOC 2 and HIPAA badges, and raised $8.5M led by
  Seven Seven Six. Aidaly publishes no public developer program, API documentation, SDK or machine-readable
  contract.
